<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CalDAV Assistant — Task Selector</title><link rel="stylesheet" href="workspace.css"><script type="importmap">{"imports":{"ical.js":"./node_modules/ical.js/dist/ical.js"}}</script></head>
<body><main><header class="app-header"><h1>CalDAV Assistant</h1></header><nav class="tool-nav"><a class="active" href="selector.html">工作</a><a href="#today">今天</a><a href="#record">记录</a><a href="#logs">日志</a><a href="#wordpress">WordPress</a><a href="#tools">工具</a></nav>
<section class="card"><h2>连接 CalDAV</h2><form id="connect"><label>服务器地址 <input type="url" name="url" required placeholder="http://andrew.local:5232/" autocomplete="url"></label><label>用户名 <input name="username" autocomplete="username" required></label><label>密码 <input type="password" name="password" autocomplete="current-password" required></label><button type="submit">连接并读取</button></form></section>
<div id="notice" class="notice" role="status" aria-live="polite">独立任务选择器测试页</div>
<section class="card"><h2>选择任务</h2><label>搜索 <input id="query" type="search"></label><div id="task-list"></div></section>
<section class="card"><h2>所选任务详情</h2><p id="current-work" role="status"></p><div><button type="button" data-action="start" disabled>Start / 开始</button><button type="button" data-action="stop" disabled>Stop / 停止</button><button type="button" data-action="complete" disabled>Complete / 完成</button><button type="button" data-action="cancel" disabled>Cancel / 取消</button></div><div id="task-details" aria-live="polite"></div></section>
<section class="card" id="today"><h2>今天</h2><p class="muted">直接读取 CalDAV 的 Task 与 Event。</p><div id="today-items">连接后显示。</div></section>
<section class="card" id="event-editor" hidden><h2>修改 Event</h2><form id="event-form"><label>标题 <input name="title" required></label><label>地点 <input name="location"></label><button type="submit">保存并回读验证</button> <button type="button" id="event-cancel">取消</button></form><p id="event-result" role="status"></p></section>
<section class="card"><h2>快速追加</h2><p class="muted">WordPress 独立输出；失败不会阻塞 Task 操作。</p><textarea id="quick-capture" aria-label="快速追加" placeholder="粘贴文字 / 图片 / 文件，或将文件拖到这里"></textarea><p><button type="button" id="retry-captures">重试待补写</button> <span id="capture-result" role="status"></span></p></section>
<section class="card" id="wordpress"><h2>Post 预览</h2><details><summary>WordPress REST 设置</summary><form id="wordpress-connect"><label>WordPress URL <input type="url" name="url" placeholder="https://andrew.local" required></label><label>用户名 <input name="username" autocomplete="username" required></label><label>Application Password <input type="password" name="password" autocomplete="current-password" required></label><button type="submit">保存到本设备</button></form></details><p><button type="button" id="refresh-post">刷新 Post</button> <a id="open-post" target="_blank" rel="noopener noreferrer" hidden>打开 Post</a></p><p id="preview-status" class="muted">尚未连接 WordPress。</p><iframe id="post-preview" title="今天的完整 WordPress Post" sandbox="allow-same-origin allow-forms allow-popups" hidden></iframe></section>
</main><script type="module" src=".build/selector.js"></script></body></html>
