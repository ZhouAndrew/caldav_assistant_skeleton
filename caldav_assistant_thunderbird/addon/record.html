<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CalDAV Assistant · 记录</title>
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
<main>
  <header class="app-header"><h1>记录</h1></header>
  <nav class="tool-nav">
    <a href="workspace.html">工作</a>
    <a href="today.html">今天</a>
    <a class="active" href="record.html">记录</a>
    <a href="logs.html">日志</a>
    <a href="wordpress.html">WordPress</a>
    <a href="tools.html">工具</a>
  </nav>

  <div class="tool-grid">
    <section class="card">
      <p class="muted">每次只追加一条到今天的 WordPress 日志；只有今天还没有日志文章时才会自动创建。</p>
      <div class="form-grid">
        <label>日志内容<textarea id="content"></textarea></label>
        <label>附件<input id="files" type="file" multiple></label>
      </div>
      <div class="tool-actions"><button id="submit">追加日志</button></div>
    </section>

    <section class="card">
      <h2>最近结果</h2>
      <div id="result">尚未写入。</div>
      <p><a href="logs.html">查看详细日志</a></p>
    </section>
  </div>
</main>
<script src="core/storage.js"></script>
<script src="core/wordpress.js"></script>
<script src="record.js"></script>
</body>
</html>
