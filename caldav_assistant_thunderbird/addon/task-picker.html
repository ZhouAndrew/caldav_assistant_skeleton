<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>选择 Task · CalDAV Assistant</title>
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <main>
    <header class="app-header">
      <h1>CalDAV Assistant</h1>
    </header>

    <nav class="tool-nav" aria-label="CalDAV Assistant">
      <a class="active" href="workspace.html">工作</a>
      <a href="today.html">今天</a>
      <a href="record.html">记录</a>
      <a href="logs.html">日志</a>
      <a href="wordpress.html">WordPress</a>
    <a href="tools.html">工具</a>
    </nav>

    <div class="subpage-head">
      <a href="workspace.html">← 返回当前工作</a>
      <h2>选择 Task</h2>
    </div>

    <div id="notice" class="notice" hidden></div>

    <p class="muted">优先使用 Thunderbird 原生 Tasks 列表中当前单选的 Task；下方列表仅作为后备选择。</p>

    <section id="current-strip" class="current-strip" hidden>
      <span id="current-strip-text"></span>
      <a href="workspace.html">查看</a>
    </section>

    <div class="work-layout">
      <section class="card task-browser">
        <div class="native-task-selector">
          <fieldset class="native-task-filter-group">
            <legend>Filter Tasks</legend>
            <label><input type="radio" name="task-view" value="throughcurrent"> 当前任务</label>
            <label><input type="radio" name="task-view" value="throughtoday"> 今天</label>
            <label><input type="radio" name="task-view" value="throughsevendays"> 接下来七天</label>
            <label><input type="radio" name="task-view" value="notstarted"> 未开始</label>
            <label><input type="radio" name="task-view" value="overdue"> 已逾期</label>
            <label><input type="radio" name="task-view" value="completed"> 已完成</label>
            <label><input type="radio" name="task-view" value="open"> 未完成</label>
            <label><input type="radio" name="task-view" value="all"> 全部</label>
          </fieldset>

          <fieldset class="native-calendar-filter-group">
            <legend>Calendars</legend>
            <div id="task-calendar-list" class="native-calendar-list"></div>
          </fieldset>
        </div>

        <input id="task-search" type="search" placeholder="搜索 Task">
        <div class="native-filter-note">筛选、循环任务展开和 Calendar 可见性直接使用 Thunderbird 自己的选择系统。</div>
        <div id="task-list" class="item-list"></div>
      </section>

      <section class="card task-panel">
        <div id="no-selection" class="empty-state">请选择一个 Task</div>

        <div id="selection" hidden>
          <h2 id="selected-title"></h2>
          <div id="selected-state" class="task-state"></div>
          <div id="selected-due" class="task-secondary"></div>
          <div id="actions" class="action-row"></div>
          <p id="flow-note" class="muted"></p>
        </div>
      </section>
    </div>
  </main>

  <script src="core/storage.js"></script>
  <script src="core/executor.js"></script>
  <script src="task-picker.js"></script>
</body>
</html>
