<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CalDAV Assistant · 工具</title>
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
<main>
  <header class="app-header"><h1>工具</h1></header>
  <nav class="tool-nav">
    <a href="workspace.html">工作</a>
    <a href="today.html">今天</a>
    <a href="record.html">记录</a>
    <a href="logs.html">日志</a>
    <a href="wordpress.html">WordPress</a>
    <a class="active" href="tools.html">工具</a>
  </nav>

  <div class="tool-grid">
    <section class="card" id="task-defaults">
      <h2>Task 设置</h2>
      <div class="form-grid">
        <label>默认 Task 视图
          <select id="task-view">
            <option value="incomplete">未完成</option>
            <option value="today">今天</option>
            <option value="overdue">已逾期</option>
            <option value="completed">已完成</option>
            <option value="all">全部</option>
          </select>
        </label>
      </div>
      <div class="tool-actions">
        <button id="save-settings">保存设置</button>
        <button id="undo-settings" hidden>撤销刚才的视图设置</button>
        <a href="workspace.html">返回工作</a>
      </div>
      <div id="save-result" class="result-box"></div>
    </section>

    <section class="card">
      <h2>Calendar 连接测试</h2>
      <p class="muted">完整 Calendar 测试只创建临时 TEST VEVENT；它不属于 Task 生命周期，也不会作为当前工作保存。</p>
      <label>测试 Calendar
        <select id="calendar-test"></select>
      </label>
      <div class="tool-actions">
        <button id="calendar-quick">Calendar 快速测试</button>
        <button id="calendar-full">Calendar 完整读写</button>
      </div>
      <div id="test-result" class="result-box">尚未测试。</div>
      <p><a href="logs.html">查看详细日志</a></p>
    </section>

    <section class="card">
      <h2>WordPress</h2>
      <p>WordPress 设置、长期记录和连接测试使用独立页面。</p>
      <p><a href="wordpress.html"><strong>打开 WordPress 设置与测试 →</strong></a></p>
    </section>
  </div>
</main>
<script src="core/storage.js"></script>
<script src="core/connection.js"></script>
<script src="tools.js"></script>
</body>
</html>
