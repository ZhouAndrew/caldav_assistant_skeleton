[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caldav-assistant"
version = "0.1.0.dev0"
description = "Frozen architecture scaffold for CalDAV Assistant"
requires-python = ">=3.10"
dependencies = [
    "caldav==3.2.1",
]

[project.scripts]
caldav-assistant = "caldav_assistant.internal.cli.app:main"
caldav-assistant-service = "caldav_assistant.internal.runtime.service:main"
