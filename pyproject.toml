[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caldav-assistant"
version = "1.0.0"
description = "Local-first CLI assistant for CalDAV tasks, events, reminders, and extensible workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "caldav==3.2.1",
    "pyreadline3>=3.4; platform_system == 'Windows'",
]

[project.scripts]
caldav-assistant = "caldav_assistant.internal.cli.app:main"
caldav-assistant-service = "caldav_assistant.internal.runtime.service:main"

[tool.setuptools.package-data]
caldav_assistant = ["py.typed", "*.pyi"]
