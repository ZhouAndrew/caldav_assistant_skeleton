name: caldav-assistant-thunderbird-selftest

on:
  push:
    paths:
      - "caldav_assistant_thunderbird/**"
      - ".github/workflows/caldav-assistant-thunderbird-selftest.yml"
  pull_request:
    paths:
      - "caldav_assistant_thunderbird/**"
      - ".github/workflows/caldav-assistant-thunderbird-selftest.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caldav_assistant_thunderbird
    steps:
      - uses: actions/checkout@v4
      - name: Install typed development tooling
        run: npm install --no-package-lock

      - name: Syntax and full frozen-contract regression
        run: |
          find addon -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          bash -n tests/real-thunderbird-caldav.sh
          bash -n tests/real-thunderbird-wordpress.sh
      - name: Build and verify XPI
        run: |
          chmod +x packaging/build-xpi.sh
          BUILT_XPI="$(packaging/build-xpi.sh | tail -1)"
          python3 tests/check-xpi.py "$BUILT_XPI"
      - uses: actions/upload-artifact@v4
        with:
          name: caldav-assistant-thunderbird-${{ github.run_id }}-${{ github.run_attempt }}
          path: caldav_assistant_thunderbird/dist/*.xpi
          if-no-files-found: error
