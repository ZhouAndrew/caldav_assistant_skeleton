name: main-d2a585ff-manual-acceptance-relay

on:
  push:
    branches:
      - chore/main-d2a585ff-human-acceptance-20260919
    paths:
      - .github/workflows/main-d2a585ff-manual-acceptance-relay.yml

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify application source is exact merged main
        run: |
          git cat-file -e d2a585ff877d2efd092e2be97cc2a58316517a51^{commit}
          git diff --exit-code d2a585ff877d2efd092e2be97cc2a58316517a51 -- caldav_assistant pyproject.toml
      - name: Install merged package and real acceptance dependencies
        run: python -m pip install . "radicale>=3,<4" "pexpect>=4,<5"
      - name: Run assistant-operated PTY relay
        env:
          CONTROL_URL: https://api.github.com/repos/${{ github.repository }}/contents/.github/manual-acceptance/control.json
          STATUS_URL: https://api.github.com/repos/${{ github.repository }}/contents/.github/manual-acceptance/status.json
          CONTROL_REF: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python .github/manual-acceptance/main_d2a585ff_manual_relay.py
