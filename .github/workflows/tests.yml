name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "radicale==3.5.4" pexpect
      - name: Test
        run: python -m pytest -q
      - name: Real installed CLI conversation acceptance
        run: python scripts/acceptance_conversation_real.py
