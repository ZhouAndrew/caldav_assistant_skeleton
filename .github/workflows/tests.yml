name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "radicale==3.5.4" pexpect
      - name: Test
        run: python -m pytest -q
      - name: Real RFC 6578 sync-token acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/acceptance_sync_token_real.py 2>&1 | tee sync-token-acceptance-${{ matrix.python-version }}.log
      - name: Real conditional-write request-budget acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/acceptance_conditional_write_real.py 2>&1 | tee conditional-write-acceptance-${{ matrix.python-version }}.log
      - name: Real WorkLog targeted-query acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/acceptance_worklog_targeted_query_real.py 2>&1 | tee worklog-query-acceptance-${{ matrix.python-version }}.log
      - name: Real installed CLI conversation acceptance
        shell: bash
        env:
          CALDAV_ASSISTANT_ACCEPTANCE_TRANSCRIPT: conversation-transcript-${{ matrix.python-version }}.log
        run: |
          set -o pipefail
          python scripts/acceptance_conversation_real.py 2>&1 | tee conversation-acceptance-${{ matrix.python-version }}.log
      - name: Real reminder alert settings acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/acceptance_reminder_alert_settings_real.py 2>&1 | tee reminder-alert-settings-acceptance-${{ matrix.python-version }}.log
      - name: Real persistent terminal bell acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/acceptance_persistent_terminal_bell_real.py 2>&1 | tee persistent-terminal-bell-acceptance-${{ matrix.python-version }}.log
      - name: Real compact WordPress worklog acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/acceptance_wordpress_worklog_real.py 2>&1 | tee wordpress-worklog-acceptance-${{ matrix.python-version }}.log
      - name: Real installed CLI latency acceptance
        shell: bash
        env:
          CALDAV_ASSISTANT_LATENCY_TRANSCRIPT: latency-transcript-${{ matrix.python-version }}.log
        run: |
          set -o pipefail
          python scripts/acceptance_latency_real.py 2>&1 | tee latency-acceptance-${{ matrix.python-version }}.log
      - name: Real installed feature demo acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/acceptance_feature_demo_real.py 2>&1 | tee feature-demo-acceptance-${{ matrix.python-version }}.log
      - name: Real Waiting Mode Ctrl-C acceptance
        shell: bash
        env:
          CALDAV_ASSISTANT_WAIT_ACCEPTANCE_TRANSCRIPT: waiting-mode-transcript-${{ matrix.python-version }}.log
        run: |
          set -o pipefail
          python scripts/acceptance_waiting_interrupt_real.py 2>&1 | tee waiting-mode-acceptance-${{ matrix.python-version }}.log
      - name: Verify live lifecycle transcript ordering
        run: >-
          python scripts/assert_live_transcript.py
          conversation-transcript-${{ matrix.python-version }}.log
      - name: Archive conversation acceptance transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-acceptance-${{ matrix.python-version }}
          path: |
            sync-token-acceptance-${{ matrix.python-version }}.log
            conditional-write-acceptance-${{ matrix.python-version }}.log
            worklog-query-acceptance-${{ matrix.python-version }}.log
            conversation-acceptance-${{ matrix.python-version }}.log
            conversation-transcript-${{ matrix.python-version }}.log
            reminder-alert-settings-acceptance-${{ matrix.python-version }}.log
            persistent-terminal-bell-acceptance-${{ matrix.python-version }}.log
            wordpress-worklog-acceptance-${{ matrix.python-version }}.log
            latency-acceptance-${{ matrix.python-version }}.log
            latency-transcript-${{ matrix.python-version }}.log
            feature-demo-acceptance-${{ matrix.python-version }}.log
            waiting-mode-acceptance-${{ matrix.python-version }}.log
            waiting-mode-transcript-${{ matrix.python-version }}.log

  windows-pytest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "radicale==3.5.4"
      - name: Test
        shell: pwsh
        run: python -m pytest -q

  packaged-install:
    name: packaged-install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel, not the source checkout
        run: >-
          python -c "import glob, subprocess, sys;
          wheels=glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
      - name: Verify installed distribution outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip check
          python -c "import caldav_assistant; assert caldav_assistant.__version__ == '1.0.0'"
          python -c "from caldav_assistant.easy import agenda, command, complete; from caldav_assistant.api import AssistantContext"
          python -c "from importlib.resources import files; root=files('caldav_assistant'); assert root.joinpath('py.typed').is_file(); assert root.joinpath('easy.pyi').is_file()"
          caldav-assistant help
