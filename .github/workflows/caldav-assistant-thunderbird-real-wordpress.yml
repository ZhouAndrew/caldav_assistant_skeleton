name: caldav-assistant-thunderbird-real-wordpress

on:
  pull_request:
    paths:
      - "caldav_assistant_thunderbird/**"
  push:
    branches: [main]
    paths:
      - "caldav_assistant_thunderbird/**"

jobs:
  real-wordpress:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: caldav_assistant_thunderbird
    steps:
      - uses: actions/checkout@v4
      - name: Install acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mariadb-server php8.3-cli php8.3-mysql php8.3-gd php8.3-xml php8.3-curl
          sudo systemctl stop mariadb
          python3 -m venv /tmp/caldav-wp-venv
          /tmp/caldav-wp-venv/bin/pip install marionette_driver "radicale==3.8.1"
      - name: Real Thunderbird + real WordPress acceptance
        env:
          ACCEPTANCE_ARTIFACT_DIR: ${{ github.workspace }}/caldav_assistant_thunderbird/acceptance-artifacts/wordpress
        run: |
          sudo bash tests/prepare-wordpress-ci.sh /tmp/caldav-wordpress-runtime 153.1.0esr
          sudo /tmp/caldav-wp-venv/bin/python tests/real-wordpress-integrated.py --runtime /tmp/caldav-wordpress-runtime --xpi "$PWD/releases/0.4.2/caldav-assistant-thunderbird-0.4.2-20261005T090627Z-bb8c684b828b46b3a4cdba3bdd62a91e.xpi" --output "$ACCEPTANCE_ARTIFACT_DIR"
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caldav-assistant-thunderbird-wordpress
          path: caldav_assistant_thunderbird/acceptance-artifacts/wordpress
          if-no-files-found: warn
