name: caldav-assistant-thunderbird-real-caldav

on:
  pull_request:
    paths:
      - "caldav_assistant_thunderbird/**"
  push:
    branches: [main]
    paths:
      - "caldav_assistant_thunderbird/**"

jobs:
  real-thunderbird:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        thunderbird: ["153.0.2esr", "153.1.0esr", "153.1.1esr"]
        timezone: ["UTC", "Asia/Shanghai"]
    defaults:
      run:
        working-directory: caldav_assistant_thunderbird
    steps:
      - uses: actions/checkout@v4
      - name: Install acceptance dependencies
        run: |
          python3 -m pip install --user "radicale==3.8.1" marionette_driver
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Real Thunderbird + real Radicale acceptance
        env:
          ACCEPTANCE_ARTIFACT_DIR: ${{ github.workspace }}/caldav_assistant_thunderbird/acceptance-artifacts/${{ matrix.thunderbird }}-${{ matrix.timezone == 'Asia/Shanghai' && 'Asia-Shanghai' || matrix.timezone }}
        run: |
          curl -fL --retry 3 "https://archive.mozilla.org/pub/thunderbird/releases/${{ matrix.thunderbird }}/linux-x86_64/en-US/thunderbird-${{ matrix.thunderbird }}.tar.xz" -o /tmp/thunderbird.tar.xz
          tar -xJf /tmp/thunderbird.tar.xz -C /tmp
          TZ="${{ matrix.timezone }}" tests/real-thunderbird-caldav.sh --thunderbird /tmp/thunderbird/thunderbird --xpi "$PWD/releases/0.4.2/caldav-assistant-thunderbird-0.4.2-20261005T090627Z-bb8c684b828b46b3a4cdba3bdd62a91e.xpi" --output "$ACCEPTANCE_ARTIFACT_DIR"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caldav-assistant-thunderbird-diagnostics-${{ matrix.thunderbird }}-${{ matrix.timezone == 'Asia/Shanghai' && 'Asia-Shanghai' || matrix.timezone }}
          path: caldav_assistant_thunderbird/acceptance-artifacts/${{ matrix.thunderbird }}-${{ matrix.timezone == 'Asia/Shanghai' && 'Asia-Shanghai' || matrix.timezone }}
          if-no-files-found: warn
