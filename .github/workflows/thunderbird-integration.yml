name: thunderbird-integration

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  build-xpi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "radicale==3.5.4"

      - name: Validate Thunderbird integration
        run: |
          python -m pytest -q \
            tests/test_thunderbird_integration.py \
            tests/test_user_timed_work_sessions.py \
            tests/test_caldav_auto_history_calendar.py \
            tests/test_wordpress_work_session_extension.py \
            tests/test_public_api_freeze_guard.py
          python -m py_compile integrations/thunderbird/native_host.py
          node --version
          node --check integrations/thunderbird/assistant.js
          node --check integrations/thunderbird/background.js
          node --check integrations/thunderbird/experiments/assistantCalendar/parent.js
          for round in 1 2 3; do
            echo "=== Thunderbird refresh simulation round $round ==="
            node integrations/thunderbird/selftest_refresh_core.cjs
            python integrations/thunderbird/selftest_native_host_protocol.py
            python -m pytest -q tests/test_user_timed_work_sessions.py
          done
          for round in 1 2; do
            echo "=== Real Radicale Thunderbird acceptance round $round ==="
            python scripts/acceptance_thunderbird_history_calendar_real.py
          done
          python integrations/thunderbird/build-experimental-bundle.py
          python integrations/thunderbird/build-update-feed.py
          python -m py_compile             integrations/thunderbird/update-server/server.py             integrations/thunderbird/update-server/verify.py             integrations/thunderbird/update-server/selftest.py
          python integrations/thunderbird/update-server/selftest.py
          bash -n integrations/thunderbird/update-server/deploy.sh
          bash -n integrations/thunderbird/update-server/stop.sh
          bash -n integrations/thunderbird/publish-self-hosted-update.sh
          bash -n integrations/thunderbird/setup.sh
          bash integrations/thunderbird/selftest_bundle_install.sh

      - name: Inspect install artifacts
        run: |
          set -euo pipefail
          for archive in integrations/thunderbird/dist/*.xpi integrations/thunderbird/dist/*.zip; do
            unzip -t "$archive"
            unzip -l "$archive"
          done
          python -m json.tool integrations/thunderbird/dist/update-site/experimental/updates.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: caldav-assistant-thunderbird-experimental
          path: |
            integrations/thunderbird/dist/*.xpi
            integrations/thunderbird/dist/*.zip
            integrations/thunderbird/dist/update-site/experimental/
          if-no-files-found: error
