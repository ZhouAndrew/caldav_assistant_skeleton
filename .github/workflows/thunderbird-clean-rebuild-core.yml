name: thunderbird-clean-rebuild-core

on:
  push:
    branches:
      - "refactor/thunderbird-cleanroom-vtodo-20261003-sol"
    paths:
      - "caldav_assistant_thunderbird_rebuild/**"
      - ".github/workflows/thunderbird-clean-rebuild-core.yml"
  pull_request:
    paths:
      - "caldav_assistant_thunderbird_rebuild/**"
      - ".github/workflows/thunderbird-clean-rebuild-core.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caldav_assistant_thunderbird_rebuild
    steps:
      - uses: actions/checkout@v4
      - name: Install TypeScript
        run: npm install --no-package-lock
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests
        run: npm test
      - name: Bridge syntax
        run: |
          node --check addon/api/TaskBridge/implementation.js
          node -e 'JSON.parse(require("fs").readFileSync("addon/api/TaskBridge/schema.json", "utf8"))'
