name: pr62-manual-acceptance-relay

on:
  push:
    branches:
      - chore/pr62-human-acceptance-relay-20260919
    paths:
      - .github/workflows/pr62-manual-acceptance-relay.yml

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify application source is exact merged main
        run: |
          git cat-file -e 77212fcaef06f845cbb19d4877a6f6f393216950^{commit}
          git diff --exit-code 77212fcaef06f845cbb19d4877a6f6f393216950 -- caldav_assistant pyproject.toml
      - name: Install merged package and real acceptance dependencies
        run: python -m pip install . "radicale>=3,<4" "pexpect>=4,<5"
      - name: Run assistant-operated PTY relay
        env:
          CONTROL_URL: https://api.github.com/repos/${{ github.repository }}/contents/.github/manual-acceptance/control.json
          STATUS_URL: https://api.github.com/repos/${{ github.repository }}/contents/.github/manual-acceptance/status.json
          CONTROL_REF: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python .github/manual-acceptance/pr62_manual_relay.py
