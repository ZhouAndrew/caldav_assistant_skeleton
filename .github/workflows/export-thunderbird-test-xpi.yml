name: Export published Thunderbird test XPI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-thunderbird-test-xpi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'ZhouAndrew/caldav_assistant_skeleton'
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-file
          gh release download thunderbird-v0.4.4-test.1 \
            --repo "$GITHUB_REPOSITORY" --pattern '*.xpi' --dir release-file
          sha256sum release-file/*.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: published-thunderbird-v0.4.4-test.1
          path: release-file/*.xpi
          if-no-files-found: error
