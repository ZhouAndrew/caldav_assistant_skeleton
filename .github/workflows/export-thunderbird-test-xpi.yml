name: Export published Thunderbird test XPI

on:
  workflow_run:
    workflows: ["Publish CalDAV Assistant Thunderbird test XPI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'ZhouAndrew/caldav_assistant_skeleton' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-file
          gh release download thunderbird-v0.4.6-test.1 \
            --repo "$GITHUB_REPOSITORY" --pattern '*.xpi' --dir release-file
          sha256sum release-file/*.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: published-thunderbird-v0.4.6-test.1
          path: release-file/*.xpi
          if-no-files-found: error
