name: thunderbird-cleanroom

on:
  push:
    paths:
      - "caldav_assistant_thunderbird_cleanroom/**"
      - ".github/workflows/thunderbird-cleanroom.yml"
  pull_request:
    paths:
      - "caldav_assistant_thunderbird_cleanroom/**"
      - ".github/workflows/thunderbird-cleanroom.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caldav_assistant_thunderbird_cleanroom
    steps:
      - uses: actions/checkout@v4
      - name: Install TypeScript
        run: npm install --no-package-lock
      - name: Diagnostic typecheck sources
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open("tsconfig.json"))
          c["include"]=["src/**/*.ts"]
          json.dump(c,open("tsconfig.diag.json","w"))
          PY
          npx tsc -p tsconfig.diag.json --noEmit --pretty false
      - name: Diagnostic typecheck core harness
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open("tsconfig.json"))
          c["include"]=["src/**/*.ts","tests/core-harness.ts"]
          json.dump(c,open("tsconfig.diag.json","w"))
          PY
          npx tsc -p tsconfig.diag.json --noEmit --pretty false
      - name: Diagnostic typecheck migration harness
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open("tsconfig.json"))
          c["include"]=["src/**/*.ts","tests/settings-migration-harness.ts"]
          json.dump(c,open("tsconfig.diag.json","w"))
          PY
          npx tsc -p tsconfig.diag.json --noEmit --pretty false
      - name: Diagnostic typecheck service harness
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open("tsconfig.json"))
          c["include"]=["src/**/*.ts","tests/workflow-service-harness.ts"]
          json.dump(c,open("tsconfig.diag.json","w"))
          PY
          npx tsc -p tsconfig.diag.json --noEmit --pretty false
      - name: Typecheck
        run: npm run typecheck
      - name: Pure core tests
        run: npm test
      - name: Native VTODO adapter boundary
        run: |
          node --check addon/api/ThunderbirdTasks/implementation.js
          python3 -m json.tool addon/api/ThunderbirdTasks/schema.json >/dev/null
          node tests/adapter-surface-harness.js
