name: thunderbird-cleanroom

on:
  push:
    paths:
      - "caldav_assistant_thunderbird_cleanroom/**"
      - ".github/workflows/thunderbird-cleanroom.yml"
  pull_request:
    paths:
      - "caldav_assistant_thunderbird_cleanroom/**"
      - ".github/workflows/thunderbird-cleanroom.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caldav_assistant_thunderbird_cleanroom
    steps:
      - uses: actions/checkout@v4
      - name: Install TypeScript
        run: npm install --no-package-lock
      - name: Typecheck
        run: npm run typecheck
      - name: Pure core tests
        run: npm test
      - name: Build Thunderbird ES modules
        run: |
          npm run build:addon
          test -f addon/dist/workflow.js
          test -f addon/dist/workflow-service.js
          test -f addon/dist/storage-runtime.js
          grep -q 'from "./task-id.js"' addon/dist/workflow.js
          if grep -R -E 'WorkEvent|WORK-SESSION|WORK-OPEN|pause|resume|switch-away' addon/dist; then
            echo "Forbidden legacy workflow concept found in production core."
            exit 1
          fi
      - name: Native VTODO adapter boundary
        run: |
          node --check addon/api/ThunderbirdTasks/implementation.js
          python3 -m json.tool addon/api/ThunderbirdTasks/schema.json >/dev/null
          node tests/adapter-surface-harness.js
      - name: Thunderbird startup and manifest boundary
        run: |
          node --check addon/background.js
          python3 -m json.tool addon/manifest.json >/dev/null
          node tests/manifest-harness.js
